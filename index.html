<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор (ДЗ №17)</title>
    <!-- Подключаем файл стилей -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">
        <h2>Калькулятор</h2>

        <!-- Поля ввода -->
        <input type="number" id="num1" placeholder="Введите число 1">
        <input type="number" id="num2" placeholder="Введите число 2">

        <!-- Кнопки операций -->
        <div class="buttons">
            <!-- Атрибут data-op нужен JS, чтобы понять, какую кнопку нажали -->
            <button data-op="+">+</button>
            <button data-op="-">−</button>
            <button data-op="*">×</button>
            <button data-op="/">÷</button>
        </div>

        <!-- Поле для результата -->
        <div id="result" class="result">Результат: 0</div>
    </div>

    <!-- Подключаем файл скрипта (лучше всего в конце body) -->
    <script src="app.js"></script>
</body>

</html>
